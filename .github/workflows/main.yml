name: AI Course CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare deployment package
        run: |
          rm -rf deploy

          mkdir -p deploy/frontend
          mkdir -p deploy/backend

          # ===================================
          # FRONTEND - NEXT.JS STANDALONE
          # ===================================

          # Exactly same as working local setup

          # Copy public into standalone
          rm -rf frontend/.next/standalone/public
          cp -a frontend/public frontend/.next/standalone/public

          # Copy Next static assets into standalone
          mkdir -p frontend/.next/standalone/.next
          rm -rf frontend/.next/standalone/.next/static
          cp -a frontend/.next/static frontend/.next/standalone/.next/static

          # cPanel startup wrapper
          cp frontend/app.js frontend/.next/standalone/app.js

          # Copy complete ready-to-run standalone app
          cp -a frontend/.next/standalone/. deploy/frontend/

          # Copy .htaccess
          cp frontend/.htaccess deploy/frontend/.htaccess

          # cPanel/Apache direct static serving
          mkdir -p deploy/frontend/_next
          cp -a frontend/.next/static deploy/frontend/_next/static

          # cPanel/Apache direct public file serving
          cp -a frontend/public/. deploy/frontend/

          # ===================================
          # VERIFY FRONTEND
          # ===================================

          echo "===== FRONTEND ROOT ====="
          ls -la deploy/frontend

          echo "===== PUBLIC ====="
          ls -la deploy/frontend/public

          echo "===== NEXT STATIC ====="
          ls -la deploy/frontend/.next/static

          echo "===== APACHE NEXT STATIC ====="
          ls -la deploy/frontend/_next/static

          test -f deploy/frontend/app.js
          test -f deploy/frontend/server.js
          test -f deploy/frontend/.htaccess
          test -d deploy/frontend/public
          test -d deploy/frontend/.next/static

          # ===================================
          # BACKEND
          # ===================================

          cp -a backend/. deploy/backend/
          rm -rf deploy/backend/node_modules
          rm -f deploy/backend/.env

          # Verify backend .htaccess exists
          test -f deploy/backend/.htaccess

          # ===================================
          # ARCHIVE
          # ===================================

          tar -czf deploy.tar.gz -C deploy .

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d \
            > ~/.ssh/ai_course_cicd

          chmod 600 ~/.ssh/ai_course_cicd

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          cat deploy.tar.gz | ssh \
            -i ~/.ssh/ai_course_cicd \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            '
              set -e

              DEPLOY_DIR="$HOME/ai-course-deploy"

              FRONTEND_DIR="$HOME/public_html/f.api.ai-course.elearnp.com"
              BACKEND_DIR="$HOME/public_html/api.ai-course.elearnp.com"

              # -----------------------------------
              # Prepare temporary deployment folder
              # -----------------------------------

              rm -rf "$DEPLOY_DIR"
              mkdir -p "$DEPLOY_DIR/extracted"

              cat > "$DEPLOY_DIR/deploy.tar.gz"

              tar -xzf "$DEPLOY_DIR/deploy.tar.gz" \
                -C "$DEPLOY_DIR/extracted"

              # -----------------------------------
              # Deploy frontend
              # -----------------------------------

              mkdir -p "$FRONTEND_DIR"

              rm -rf "$FRONTEND_DIR"/*
              rm -rf "$FRONTEND_DIR"/.[!.]* \
                     "$FRONTEND_DIR"/..?* \
                     2>/dev/null || true

              cp -a \
                "$DEPLOY_DIR/extracted/frontend/." \
                "$FRONTEND_DIR/"

              # Restart frontend Node.js application
              mkdir -p "$FRONTEND_DIR/tmp"
              touch "$FRONTEND_DIR/tmp/restart.txt"

              # -----------------------------------
              # Deploy backend
              # -----------------------------------

              mkdir -p "$BACKEND_DIR"

              cp -a \
                "$DEPLOY_DIR/extracted/backend/." \
                "$BACKEND_DIR/"

              cd "$BACKEND_DIR"

              npm ci --omit=dev

              # Restart backend Node.js application
              mkdir -p tmp
              touch tmp/restart.txt

              # -----------------------------------
              # Cleanup
              # -----------------------------------

              rm -rf "$DEPLOY_DIR"

              echo "Deployment completed successfully"
            '
