name: AI Course CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy/frontend
          mkdir -p deploy/backend

          cp -a frontend/out/. deploy/frontend/
          cp -a backend/. deploy/backend/

          rm -rf deploy/backend/node_modules
          rm -f deploy/backend/.env

          tar -czf deploy.tar.gz -C deploy .

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/ai_course_cicd
          chmod 600 ~/.ssh/ai_course_cicd
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

          - name: Deploy to server
        run: |
          base64 -w 0 deploy.tar.gz > deploy.tar.b64

          ssh \
            -i ~/.ssh/ai_course_cicd \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'mkdir -p ~/ai-course-deploy && cat > ~/ai-course-deploy/deploy.tar.b64'

          ssh \
            -i ~/.ssh/ai_course_cicd \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -s' <<'REMOTE_SCRIPT'
          set -e

          DEPLOY_DIR="$HOME/ai-course-deploy"
          FRONTEND_DIR="$HOME/public_html/f.api.ai-course.elearnp.com"
          BACKEND_DIR="$HOME/public_html/api.ai-course.elearnp.com"

          base64 -d "$DEPLOY_DIR/deploy.tar.b64" > "$DEPLOY_DIR/deploy.tar.gz"
          mkdir -p "$DEPLOY_DIR/extracted"

          tar -xzf "$DEPLOY_DIR/deploy.tar.gz" -C "$DEPLOY_DIR/extracted"

          mkdir -p "$FRONTEND_DIR"
          rm -rf "$FRONTEND_DIR"/*
          rm -rf "$FRONTEND_DIR"/.[!.]* "$FRONTEND_DIR"/..?* 2>/dev/null || true
          cp -a "$DEPLOY_DIR/extracted/frontend/." "$FRONTEND_DIR/"

          mkdir -p "$BACKEND_DIR"
          cp -a "$DEPLOY_DIR/extracted/backend/." "$BACKEND_DIR/"

          cd "$BACKEND_DIR"
          npm ci --omit=dev

          mkdir -p tmp
          touch tmp/restart.txt

          rm -rf "$DEPLOY_DIR"

          echo "Deployment completed successfully"
          REMOTE_SCRIPT
